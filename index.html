<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Stream Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="toolbar">
    <span id="app-title">TRADING STREAMS</span>

    <div id="toolbar-right">
      <span id="live-count">&mdash; LIVE</span>
      <button id="btn-sync" title="Sync all streams to live edge">&#9654;&#9654;</button>
      <button id="btn-refresh" title="Refresh live status">&#8635;</button>
      <button id="btn-manage" title="Manage channels">&#9881;</button>
    </div>
  </header>

  <main id="grid-container">
    <!-- .stream-cell divs injected by app.js -->
  </main>

  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Manage Channels">
    <div id="modal">
      <div id="modal-header">
        <h2>Manage Channels</h2>
        <button id="btn-close-modal" title="Close">&times;</button>
      </div>

      <div id="api-key-section">
        <label for="api-key-input">YouTube API Key</label>
        <div class="input-row">
          <input id="api-key-input" type="password" placeholder="AIza...">
          <button id="btn-save-key">Save</button>
        </div>
        <p class="hint">Get a free key at <strong>console.cloud.google.com</strong> &rarr; YouTube Data API v3</p>
      </div>

      <div id="channel-list-section">
        <h3>Channels</h3>
        <ul id="channel-list">
          <!-- populated by app.js -->
        </ul>
      </div>


      <div id="add-channel-section">
        <h3>Add Channel</h3>
        <div class="input-row">
          <input id="channel-input" type="text" placeholder="Live stream URL, @handle, channel URL, or UC... ID">
          <button id="btn-add-channel">Add</button>
        </div>
        <p class="hint">Paste a live stream URL, channel URL, @handle, or channel ID (UC...)</p>
      </div>
    </div>
  </div>
  <div id="toast-container" aria-live="polite"></div>

  <script src="config.js"></script>

  <script src="app.js"></script>
</body>
</html>
